<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Configuración para pantalla de iPhone 13 / Móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- TÍTULO SIN SPOILER -->
    <title>Una sorpresa para ti... ❤️</title>

    <!-- BIBLIOTECA PARA CONFETIS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1e4620; /* Fondo verde oscuro elegante */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soporte para el área segura del iPhone */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Pantalla de Inicio */
        #pantalla-inicio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e4620;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
            padding: 20px;
        }

        .titulo-inicio {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-iniciar {
            background-color: #ffffff;
            color: #1e4620;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-iniciar:active {
            transform: scale(0.95);
            background-color: #e0e0e0;
        }

        /* Mensaje Central */
        .mensaje-central {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
            padding: 0 20px;
            width: 100%;
        }

        .mensaje-central h1 {
            font-size: 2.3rem; /* Tamaño adaptado a móvil */
            line-height: 1.3;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
            animation: latido 1.8s infinite alternate;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        /* FOTOS FLOTANTES (Sin bordes) */
        .foto-flotante {
            position: absolute;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
            pointer-events: none;
            z-index: 1;

            /* Sin bordes ni sombras */
            border: none;
            border-radius: 0px;
            box-shadow: none;
        }

        .foto-flotante.visible {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- ELEMENTO DE AUDIO (OCULTO) -->
    <audio id="musica-fondo" loop preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- PANTALLA DE INICIO -->
    <div id="pantalla-inicio">
        <h2 class="titulo-inicio">Tengo algo para ti... ✨</h2>
        <button class="btn-iniciar" onclick="comenzar()">Abrir ❤️</button>
    </div>

    <!-- MENSAJE CENTRAL -->
    <div class="mensaje-central" id="mensaje-central">
        <h1>¡Feliz Cumpleaños,<br>Mi Amor! ❤️</h1>
    </div>

    <script>
        // LISTA DE TUS 16 FOTOS
        const misFotos = [
            'foto1.jpg',
            'foto2.jpg',
            'foto3.jpg',
            'foto4.jpg',
            'foto5.jpg',
            'foto6.jpg',
            'foto7.jpg',
            'foto8.jpg',
            'foto9.jpg',
            'foto10.jpeg',
            'foto11.jpeg',
            'foto12.jpeg',
            'foto13.jpeg',
            'foto14.jpeg',
            'foto15.jpeg',
            'foto16.jpeg'
        ];

        function comenzar() {
            const inicio = document.getElementById('pantalla-inicio');
            const mensaje = document.getElementById('mensaje-central');
            const musica = document.getElementById('musica-fondo');

            // 1. REPRODUCIR MÚSICA DE FONDO
            musica.play().catch(error => {
                console.log("No se pudo reproducir la música: ", error);
            });

            // 2. Cambiar título del navegador al hacer clic
            document.title = "¡Feliz Cumpleaños, Mi Amor!";

            // 3. Transición de pantalla
            inicio.style.opacity = '0';
            setTimeout(() => {
                inicio.style.display = 'none';
                mensaje.style.opacity = '1';
                
                // 4. Lanzar confetis e iniciar fotos
                lanzarConfetisIniciales();
                iniciarLluviaConfeti();
                iniciarSecuenciaFotos();
            }, 1500);
        }

        // EXPLOSIÓN INICIAL DE CONFETI
        function lanzarConfetisIniciales() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // LLUVIA SUAVE Y CONTINUA DE CONFETI
        function iniciarLluviaConfeti() {
            setInterval(() => {
                if (document.hidden) return;
                confetti({
                    particleCount: 2,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffffff', '#ff4d6d', '#ffb703', '#70e000']
                });
                confetti({
                    particleCount: 2,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffffff', '#ff4d6d', '#ffb703', '#70e000']
                });
            }, 800);
        }

        function iniciarSecuenciaFotos() {
            crearFotoApareciendo();
            setInterval(crearFotoApareciendo, 2000);
        }

        function crearFotoApareciendo() {
            if (document.hidden) return;

            const img = document.createElement('img');
            img.classList.add('foto-flotante');

            const fotoAleatoria = misFotos[Math.floor(Math.random() * misFotos.length)];
            img.src = fotoAleatoria;

            // Tamaño adaptado para iPhone 13
            const baseSize = Math.floor(Math.random() * 80) + 130;
            img.style.width = `${baseSize}px`;

            // Márgenes adaptados al iPhone
            const marginX = 15;
            const marginY = 40;
            const posX = Math.random() * (window.innerWidth - baseSize - marginX * 2) + marginX;
            const posY = Math.random() * (window.innerHeight - (baseSize * 1.2) - marginY * 2) + marginY;

            img.style.left = `${posX}px`;
            img.style.top = `${posY}px`;

            const rotacion = (Math.random() - 0.5) * 18;
            img.style.transform = `rotate(${rotacion}deg)`;

            document.body.appendChild(img);

            // Aparecer (Fade In)
            setTimeout(() => {
                img.classList.add('visible');
                img.style.transform = `rotate(${rotacion}deg) scale(1.04)`;
            }, 100);

            // Permanencia de 8 segundos
            const tiempoVisible = 8000;

            setTimeout(() => {
                // Desaparecer (Fade Out)
                img.classList.remove('visible');
                img.style.transform = `rotate(${rotacion}deg) scale(1)`;

                setTimeout(() => {
                    img.remove();
                }, 2500);

            }, tiempoVisible);
        }
    </script>
</body>
</html>
